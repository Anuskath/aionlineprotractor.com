<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <style>
      .protractor-stroke { stroke: #171717; }
      .protractor-fill { fill: #171717; }
      @media (prefers-color-scheme: dark) {
        .protractor-stroke { stroke: #ededed; }
        .protractor-fill { fill: #ededed; }
      }
    </style>
  </defs>
  <!-- Semicircle Outer Rim -->
  <path d="M 6 42 A 26 26 0 0 1 58 42 Z" class="protractor-stroke" stroke-width="3.5" fill="none" stroke-linejoin="round" />
  <!-- Center Vertex -->
  <circle cx="32" cy="42" r="3" class="protractor-fill" />
  <!-- Rays -->
  <line x1="32" y1="42" x2="32" y2="18" class="protractor-stroke" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="32" y1="42" x2="52" y2="24" class="protractor-stroke" stroke-width="2.5" stroke-linecap="round" stroke="#3b82f6" />
  <circle cx="52" cy="24" r="2.5" fill="#3b82f6" />
</svg>
